name: Integration - Dev1 + Dev5 + Dev6

on:
  push:
    branches:
      - main
      - integracao-e2e
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application
        run: python -m compileall -q app
      - name: Test retrieval and integration adapters
        run: |
          python -m unittest discover -s tests -p 'test_retrieval.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator.py' -v
          python -m unittest discover -s tests -p 'test_source_adapter.py' -v
