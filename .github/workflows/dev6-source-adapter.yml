name: Dev6 source adapter tests

on:
  push:
    branches:
      - dev6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar normalização das fontes
        run: python -m unittest discover -s tests -p 'test_source_adapter.py' -v
