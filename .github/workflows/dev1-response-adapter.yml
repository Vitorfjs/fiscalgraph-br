name: Dev1 response adapter tests

on:
  push:
    branches:
      - dev1-integracao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar contrato da resposta final
        run: python -m unittest discover -s tests -p 'test_response_adapter.py' -v
